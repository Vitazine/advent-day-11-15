# Included in existing TLS server only. Never proxy caller-supplied IP/auth headers.
location = /day13 { return 308 /day13/; }
location ^~ /day13/ {
    auth_basic "Day 13 Gateway";
    auth_basic_user_file /etc/day13/access.htpasswd;
    access_log off;
    error_log /var/log/nginx/day13-error.log crit;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    limit_req zone=day13_edge burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8130;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Day13-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_read_timeout 70s;
    proxy_send_timeout 10s;
    proxy_buffering on;
    proxy_max_temp_file_size 0;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
